name: Autopilot

# Taeglich sechs Folgen schreiben, produzieren, veroeffentlichen.
#
# WARUM FUENF UND NICHT SECHS:
# Ein Upload kostet 1600 Kontingent-Einheiten der YouTube Data API, ein
# Thumbnail zusaetzlich 50. Das Tageskontingent betraegt 10.000 je
# Google-Cloud-Projekt.
#   6 Folgen: 6x1600 + 6x50 = 9.900 von 10.000 - nur 100 Einheiten Rest.
#             Ein einziger Fehlversuch sprengt den Tag.
#   5 Folgen: 5x1600 + 5x50 = 8.250 - 1.750 Einheiten Rest.
# Die 1.750 sind kein Zufall: eine woechentliche Sammelfolge kostet
# 1.600 + 50 = 1.650 und passt damit an jedem Tag dazwischen.
#
# WICHTIG: Das Kontingent haengt am CLOUD-PROJEKT, nicht am Kanal. Dieser
# Kanal braucht deshalb ein eigenes Projekt - teilt er sich eines mit dem
# Kinderkanal, nehmen sich beide gegenseitig die Uploads weg.
#
# Anders als beim Kinderkanal gibt es hier nur ein Format: 9:16. Das
# Doodle-Format ist auf Hochkant ausgelegt, eine Breitfassung waere ein
# Bild mit sehr viel schwarzem Rand.

on:
  schedule:
    # BEWUSST UEBERPLANT: GitHub fuehrt geplante Workflows unter Last
    # verspaetet aus oder laesst sie ganz ausfallen. Drei Startversuche,
    # day_guard.py laesst nur den ersten erfolgreichen durch.
    # Englischsprachiges Publikum: 13:00-21:00 UTC deckt den US-Vormittag
    # bis in den EU-Abend ab. Bewusst nur fuenf Trigger statt dreizehn -
    # GitHub verschluckt geplante Laeufe, wenn ein Konto zu viele davon
    # hat, und drei Bots teilen sich hier bereits eines. Weniger, dafuer
    # zuverlaessiger.
    - cron: "0 13 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"
    - cron: "0 21 * * *"   # Nachholversuch
  workflow_dispatch:
    inputs:
      anzahl:
        description: "Wie viele Folgen (max 5, siehe Kontingent oben)"
        required: false
        default: "5"
      privacy:
        description: "private | unlisted | public"
        required: false
        default: "public"

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: |
          npm ci
          # npm >=11 blockt Install-Skripte; ohne das faellt esbuild aus
          npm approve-scripts esbuild || true
          npm rebuild esbuild
          python -m venv venv
          ./venv/bin/pip install --quiet edge-tts numpy anthropic \
            google-api-python-client google-auth-oauthlib

      - name: Musikbett erzeugen
        run: ./venv/bin/python scripts/music.py

      - name: Folgen produzieren und veroeffentlichen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # publish.py sucht YOUTUBE_TOKEN_<LANG>. Der Kanal ist englisch,
          # also EN - nicht DE wie in der Vorlage aus doodle-finanz.
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
          ANZAHL: ${{ inputs.anzahl || '5' }}
          PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          set -e
          # Heute schon produziert? Dann ist das ein Nachholversuch, den
          # es nicht braucht.
          if ! ./venv/bin/python scripts/day_guard.py --check; then
            exit 0
          fi
          # An Sammelfolgen-Tagen (Mo/Mi/Fr) weniger Shorts: dort
          # braucht sammelfolge.yml 1.650 Einheiten vom Tageskontingent.
          DOW=$(date -u +%u)
          case "$DOW" in
            1|3|5) ANZAHL=3 ; echo "Sammelfolgen-Tag: nur $ANZAHL Shorts" ;;
          esac
          GESCHAFFT=0
          for i in $(seq 1 "$ANZAHL"); do
            echo "===== Folge $i von $ANZAHL ====="
            # Ein Thema, das dreimal durch die Pruefung faellt, darf nicht
            # den ganzen Tageslauf abbrechen - naechstes Thema, weiter.
            if ! ./venv/bin/python scripts/versus_gen.py --next; then
              echo "Thema uebersprungen, weiter mit dem naechsten"
              continue
            fi
            SLUG=$(./venv/bin/python -c "import json,pathlib; print(json.loads(pathlib.Path('episodes/queue.json').read_text())['used'][-1])")
            ./venv/bin/python scripts/make_episode.py --episode "$SLUG" --lang en
            ./venv/bin/python scripts/publish.py --episode "$SLUG" --lang en \
              --publish --privacy "$PRIVACY"
            GESCHAFFT=$((GESCHAFFT + 1))
          done
          # Nur abhaken, wenn wirklich etwas hochgeladen wurde. Am 09.09.
          # fiel jedes Thema aus (Anthropic-Guthaben leer), der Lauf galt
          # trotzdem als erledigt und sperrte den Rest des Tages aus.
          if [ "$GESCHAFFT" -gt 0 ]; then
            ./venv/bin/python scripts/day_guard.py --mark
          else
            echo "Keine einzige Folge veroeffentlicht - Tag bleibt offen." >&2
            exit 1
          fi

      - name: Kopien ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folgen-${{ github.run_number }}
          path: out/*.mp4
          retention-days: 14

      - name: Themenliste zurueckschreiben
        if: always()
        run: |
          git config user.name  "doodle-autopilot"
          git config user.email "actions@github.com"
          git add episodes/
          git commit -m "Autopilot-Lauf ${{ github.run_number }}" || echo "nichts zu committen"
          # Der Bot committet bei jedem Lauf auf main. Kommt dazwischen ein
          # anderer Push, wird dieser hier abgewiesen - und der Lauf gilt als
          # gescheitert, obwohl die Videos laengst oeffentlich sind. Also erst
          # committen, dann rebasen, dann pushen, mit ein paar Anlaeufen.
          for versuch in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push-Versuch $versuch abgewiesen, neuer Anlauf"
            sleep $((versuch * 5))
          done
          echo "Themenliste liess sich nicht zurueckschreiben." >&2
          exit 1
